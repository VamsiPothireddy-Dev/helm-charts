{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ .Values.appName }}-virtualservice
spec:
  hosts:
    - {{ .Values.istio.host | quote }}
  gateways:
    - {{ .Values.istio.gateway | quote }}
  http:
    - name: default
      {{- if .Values.istio.pathPrefix }}
      match:
        - uri:
            exact: {{ .Values.istio.pathPrefix | quote }}
        - uri:
            prefix: {{ printf "%s/" .Values.istio.pathPrefix | quote }}
      rewrite:
        uri: /
      {{- else }}
      match:
        - uri:
            prefix: /
      {{- end }}
      route:
        - destination:
            host: {{ .Values.appName }}-service.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
{{- end }}
