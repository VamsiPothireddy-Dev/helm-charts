apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}-deployment  # Generalized name based on appName from values.yaml
  labels:
    {{- include "services.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}  # Use appName from values.yaml
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}  # Use appName from values.yaml
        sidecar.istio.io/inject: "true"
    spec:
      {{- if .Values.persistence.enabled }}
      securityContext:
        fsGroup: 999
      {{- end }}
      containers:
      - name: {{ .Values.appName }}  # Use appName from values.yaml
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        env:
          {{- with .Values.env }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          - name: IMAGE_TAG
            value: {{ .Values.image.tag | quote }}
        {{- if .Values.persistence.enabled }}
        volumeMounts:
        - name: data
          mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Values.appName }}-data
      {{- end }}
